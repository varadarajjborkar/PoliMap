<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoverPath: know what your hospital stay will cost</title>
    <meta name="description" content="Insurance-aware hospital decision support for patients and caregivers in India." />

    <!-- The mark is transparent, so it sits on whatever the browser or phone
         puts behind it rather than carrying a white tile around. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Colours the browser chrome on a phone, matched to each theme so the
         address bar does not sit as a bright band above a dark page. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
