[tool.pytest.ini_options]
# ".." puts the repository root on the path so tests can import `datagen`.
pythonpath = [".", ".."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "live: hits the real model API; deselect with -m 'not live'",
]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
